<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paper Digest{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<header class="border-b border-slate-200 bg-white">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/today" class="font-semibold text-slate-900 hover:text-slate-700">Paper Digest</a>
    <nav class="flex items-center gap-4 text-sm">
      {% if user %}
        <a href="/today" class="hover:text-slate-900 {% if active_nav == 'today' %}text-slate-900 font-medium{% else %}text-slate-500{% endif %}">Today</a>
        <a href="/archive" class="hover:text-slate-900 {% if active_nav == 'archive' %}text-slate-900 font-medium{% else %}text-slate-500{% endif %}">Archive</a>
        <a href="/configs" class="hover:text-slate-900 {% if active_nav == 'configs' %}text-slate-900 font-medium{% else %}text-slate-500{% endif %}">Configs</a>
        <a href="/settings" class="hover:text-slate-900 {% if active_nav == 'settings' %}text-slate-900 font-medium{% else %}text-slate-500{% endif %}">Settings</a>
        <span class="text-slate-300">·</span>
        <span class="text-slate-500">{{ user.email }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="text-slate-500 hover:text-red-500">Logout</button>
        </form>
      {% else %}
        <a href="/login" class="text-slate-500 hover:text-slate-900">Login</a>
        <a href="/register" class="px-3 py-1.5 rounded-md bg-slate-900 text-white border border-slate-900 hover:bg-slate-700 text-sm font-medium">Register</a>
      {% endif %}
    </nav>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6">
  {% if flash %}
    <div class="mb-4 px-4 py-2 rounded-md text-sm
      {% if flash.kind == 'error' %}bg-red-50 text-red-700 border border-red-200
      {% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">
      {{ flash.text }}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

</body>
</html>
