{# expects: cfg, configs, base_path (eg "/today" or "/archive"), extra_qs (str, optional) #}
{% if configs and configs | length > 1 %}
  <form method="get" action="{{ base_path }}" class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">配置</label>
    <select name="config_id" onchange="this.form.submit()"
            class="px-2 py-1 rounded-md border border-slate-300 text-sm">
      {% for c in configs %}
        <option value="{{ c.id }}" {% if cfg and c.id == cfg.id %}selected{% endif %}>
          {{ c.name }}{% if c.is_default %} (默认){% endif %}
        </option>
      {% endfor %}
    </select>
    {% if extra_qs %}
      {% for k, v in extra_qs.items() %}
        <input type="hidden" name="{{ k }}" value="{{ v }}">
      {% endfor %}
    {% endif %}
  </form>
{% elif cfg %}
  <span class="text-sm text-slate-500">配置: <span class="text-slate-900">{{ cfg.name }}</span></span>
{% endif %}
