{% extends "base.html" %}
{% block title %}注册 · Paper Digest{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-8 bg-white border border-slate-200 rounded-lg p-6">
  <h1 class="text-lg font-semibold text-slate-900 mb-4">注册</h1>
  <form method="post" action="/register" class="space-y-3">
    <div>
      <label class="block text-xs text-slate-500 mb-1">邮箱</label>
      <input class="w-full px-3 py-1.5 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-1 focus:ring-slate-900"
             type="email" name="email" value="{{ email or '' }}" required>
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">密码（≥ 8 位）</label>
      <input class="w-full px-3 py-1.5 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-1 focus:ring-slate-900"
             type="password" name="password" required minlength="8">
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">时区</label>
      <select class="w-full px-3 py-1.5 rounded-md border border-slate-300 text-sm" name="tz">
        <option value="Asia/Shanghai" selected>Asia/Shanghai</option>
        <option value="Asia/Tokyo">Asia/Tokyo</option>
        <option value="UTC">UTC</option>
        <option value="America/Los_Angeles">America/Los_Angeles</option>
        <option value="America/New_York">America/New_York</option>
        <option value="Europe/London">Europe/London</option>
      </select>
    </div>
    <div>
      <label class="block text-xs text-slate-500 mb-1">邀请码（如平台开启邀请）</label>
      <input class="w-full px-3 py-1.5 rounded-md border border-slate-300 text-sm focus:outline-none focus:ring-1 focus:ring-slate-900"
             type="text" name="invite_code" placeholder="留空若平台开放注册">
    </div>
    <button class="w-full px-3 py-1.5 rounded-md bg-slate-900 text-white text-sm font-medium hover:bg-slate-700">
      注册
    </button>
  </form>
  <p class="text-xs text-slate-500 mt-4 text-center">
    已有账号？<a href="/login" class="text-slate-900 hover:underline">登录</a>
  </p>
</div>
{% endblock %}
